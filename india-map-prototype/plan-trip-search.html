<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ancient Trails Plan Your Trip</title>
    <link rel="stylesheet" href="./plan-trip-search.css" />
  </head>
  <body>
    <main class="trip-page">
      <div class="trip-focus-backdrop" id="tripFocusBackdrop" hidden></div>

      <header class="nav-shell">
        <a class="brand" href="#" aria-label="Ancient Trails home">
          <img class="brand-mark" src="./assets/ancient-trails-logo.png" alt="Ancient Trails" />
          <span class="brand-copy">A quest for<br />Indian heritage</span>
        </a>

        <span class="brand-divider"></span>

        <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
          <button class="nav-link active" type="button">Home</button>
          <button class="nav-link" type="button">About</button>
          <button class="nav-link" type="button">Tours</button>
          <button class="nav-link" type="button">Interests</button>
          <button class="nav-link" type="button">Destinations</button>
          <button class="nav-link" type="button">Experiences</button>
          <button class="nav-link" type="button">Tour Calendar</button>
          <a class="mobile-login-link" href="#">
            <span>Login</span>
            <span class="mobile-login-dot" aria-hidden="true"></span>
          </a>
        </nav>

        <a class="login" href="#">
          <span>Login</span>
          <span class="user-icon" aria-hidden="true"></span>
        </a>
      </header>

      <section class="journey-hero" id="journeyHero" aria-label="Plan your trip">
        <button class="trip-pill" id="planTripButton" type="button">
          <span>Plan your trip</span>
          <span aria-hidden="true">→</span>
        </button>

        <form class="trip-search" id="tripSearch" aria-hidden="true">
          <button class="trip-field" type="button">
            <span class="trip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 21s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12Z" />
                <circle cx="12" cy="9" r="2.5" />
              </svg>
            </span>
            <span>Where to?</span>
          </button>
          <button class="trip-field" type="button">
            <span class="trip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="4" y="5" width="16" height="15" rx="2" />
                <path d="M8 3v5M16 3v5M4 10h16" />
              </svg>
            </span>
            <span>Any Month</span>
          </button>
          <button class="trip-field" type="button">
            <span class="trip-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="9" cy="8" r="4" />
                <path d="M2.8 20c.8-4.2 2.9-6.3 6.2-6.3S14.4 15.8 15.2 20" />
                <circle cx="17" cy="8.8" r="3" />
                <path d="M15.6 14.3c3 .4 4.8 2.3 5.5 5.7" />
              </svg>
            </span>
            <span>2 Adults</span>
          </button>
          <button class="trip-submit" type="submit">
            <span>Plan your trip</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>
      </section>
    </main>

    <script src="./plan-trip-search.js"></script>
  </body>
</html>
