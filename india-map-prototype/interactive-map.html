<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive India Map</title>
    <link rel="stylesheet" href="./interactive-map.css?v=20260706-4" />
  </head>
  <body>
    <main class="scene">
      <aside class="intro-panel">
        <section class="popular">
          <h2>Popular Destinations</h2>
          <div class="destination-list" id="destinationList"></div>
        </section>
      </aside>

      <section class="map-wrap">
        <div class="map-zoom-layer" id="mapZoomLayer">
          <img class="map-image" src="./assets/india-destinations-map.png" alt="Illustrated map of India" />
          <div class="pin-layer" id="pinLayer"></div>
        </div>
      </section>

      <aside class="detail-card" id="detailCard"></aside>

      <div class="map-controls" aria-label="Map controls">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="resetMap" type="button" aria-label="Reset map">⌾</button>
      </div>

      <div class="compass" aria-hidden="true">
        <span>N</span>
        <span>E</span>
        <span>S</span>
        <span>W</span>
        <i></i>
      </div>

      <button class="builder-toggle" id="editToggle" type="button">Edit Pins</button>
      <button class="builder-add" id="addPin" type="button">Add Pin</button>

      <section class="editor-card hidden" id="editorCard">
        <div class="editor-heading">
          <div>
            <p>Pin Editor</p>
            <h2 id="editorTitle">Jaipur</h2>
          </div>
          <span>XY</span>
        </div>
        <label class="slider-row">
          <span>X position <b id="xValue">0%</b></span>
          <input id="xSlider" type="range" min="0" max="100" step="0.1" />
        </label>
        <label class="slider-row">
          <span>Y position <b id="yValue">0%</b></span>
          <input id="ySlider" type="range" min="0" max="100" step="0.1" />
        </label>
        <label class="slider-row">
          <span>Pin size <b id="pinSizeValue">52px</b></span>
          <input id="pinSizeSlider" type="range" min="28" max="76" step="1" />
        </label>
        <label class="slider-row">
          <span>Icon size <b id="pinIconValue">24px</b></span>
          <input id="pinIconSlider" type="range" min="12" max="36" step="1" />
        </label>
        <label class="slider-row">
          <span>Border <b id="pinBorderValue">5px</b></span>
          <input id="pinBorderSlider" type="range" min="1" max="10" step="1" />
        </label>
        <button class="copy-button" id="copyJson" type="button">Copy Pin JSON</button>
      </section>
    </main>

    <script src="./interactive-map.js?v=20260706-4"></script>
  </body>
</html>
