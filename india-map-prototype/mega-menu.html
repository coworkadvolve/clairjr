<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ancient Trails Mega Menu</title>
    <link rel="stylesheet" href="./mega-menu.css?v=mega-only" />
  </head>
  <body>
    <main class="menu-demo">
      <header class="nav-shell">
        <a class="brand" href="#" aria-label="Ancient Trails home">
          <img class="brand-mark" src="./assets/ancient-trails-logo.png" alt="Ancient Trails" />
          <span class="brand-copy">A quest for<br />Indian heritage</span>
        </a>

        <span class="brand-divider"></span>

        <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
          <button class="nav-link active" data-menu="home" type="button">Home</button>
          <button class="nav-link" data-menu="about" type="button">About</button>
          <button class="nav-link" data-menu="tours" type="button">Tours</button>
          <button class="nav-link" data-menu="interests" type="button">Interests</button>
          <button class="nav-link" data-menu="destinations" type="button">Destinations</button>
          <button class="nav-link" data-menu="experiences" type="button">Experiences</button>
          <button class="nav-link" data-menu="calendar" type="button">Tour Calendar</button>
          <a class="mobile-login-link" href="#">
            <span>Login</span>
            <span class="mobile-login-dot" aria-hidden="true"></span>
          </a>
        </nav>

        <a class="login" href="#">
          <span>Login</span>
          <span class="user-icon" aria-hidden="true"></span>
        </a>
      </header>

      <section class="mega-panel" id="megaPanel" hidden>
        <aside class="story-card">
          <h2>Our Tours</h2>
          <p>Ancient Trails is not just a tourism organisation.</p>
          <p>
            But it is a unique opportunity to explore the roots of Indian culture
            and the worldwide richness of our Indian heritage.
          </p>
          <a class="plan-link" href="#">
            <span>Plan your trip</span>
            <span aria-hidden="true">→</span>
          </a>
          <img class="story-image" src="./assets/menu-v2-illustration.png" alt="" />
        </aside>

        <div class="menu-content" id="menuContent"></div>
      </section>

    </main>

    <script src="./mega-menu.js?v=mega-only"></script>
  </body>
</html>
